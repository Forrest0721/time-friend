services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: time_friend
      POSTGRES_USER: time_friend
      POSTGRES_PASSWORD: time_friend
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U time_friend -d time_friend"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - time_friend_postgres:/var/lib/postgresql/data

volumes:
  time_friend_postgres:
